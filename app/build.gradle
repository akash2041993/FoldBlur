plugins {
    id 'com.android.application'
}

android {
    namespace 'com.akash.downloadmode'
    compileSdk 34

    defaultConfig {
        applicationId 'com.akash.downloadmode'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Same key on every build, so a new version installs over the old one.
    signingConfigs {
        shared {
            storeFile file('downloadmode.keystore')
            storePassword 'downloadmode'
            keyAlias 'downloadmode'
            keyPassword 'downloadmode'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

dependencies {
    def shizuku_version = '13.1.5'
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"
}
